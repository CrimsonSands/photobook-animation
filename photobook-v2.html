<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Photo Book</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #2c1810 0%, #5a3d2b 50%, #2c1810 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
}

.book-wrapper {
    perspective: 2500px;
    perspective-origin: center center;
}

.book {
    width: 820px;
    height: 600px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-25deg) rotateX(5deg);
    transition: transform 0.5s ease;
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6));
}

.book:hover {
    transform: rotateY(-20deg) rotateX(3deg);
}

/* Book spine in the center */
.book-spine {
    position: absolute;
    width: 20px;
    height: 600px;
    left: 50%;
    transform: translateX(-50%) translateZ(-10px);
    background: linear-gradient(to right,
        #1a1a1a 0%,
        #2d2d2d 20%,
        #3a3a3a 50%,
        #2d2d2d 80%,
        #1a1a1a 100%);
    box-shadow:
        inset 2px 0 4px rgba(0, 0, 0, 0.5),
        inset -2px 0 4px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(0, 0, 0, 0.3);
    z-index: 5;
}

.page {
    position: absolute;
    width: 400px;
    height: 600px;
    background: #faf9f7;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
}

/* Add paper texture */
.page::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px);
    opacity: 0.3;
    pointer-events: none;
}

/* Page thickness effect */
.page::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, transparent 3%, transparent 97%, rgba(0,0,0,0.05) 100%);
    pointer-events: none;
}

.page-left {
    left: 0;
    transform-origin: right center;
    border-right: 1px solid #d4d1ca;
    box-shadow:
        inset -5px 0 10px rgba(0, 0, 0, 0.1),
        -2px 0 5px rgba(0, 0, 0, 0.1),
        0 5px 30px rgba(0, 0, 0, 0.3);
}

.page-left:hover {
    box-shadow:
        inset -5px 0 10px rgba(0, 0, 0, 0.15),
        -2px 0 8px rgba(0, 0, 0, 0.15),
        0 5px 35px rgba(0, 0, 0, 0.4);
}

.page-right {
    right: 0;
    transform-origin: left center;
    border-left: 1px solid #d4d1ca;
    box-shadow:
        inset 5px 0 10px rgba(0, 0, 0, 0.1),
        2px 0 5px rgba(0, 0, 0, 0.1),
        0 5px 30px rgba(0, 0, 0, 0.3);
}

.page-right:hover {
    box-shadow:
        inset 5px 0 10px rgba(0, 0, 0, 0.15),
        2px 0 8px rgba(0, 0, 0, 0.15),
        0 5px 35px rgba(0, 0, 0, 0.4);
}

.page-turn {
    right: 0;
    transform-origin: left center;
    cursor: pointer;
    z-index: 10;
    display: none;
}

.page-turn.active {
    display: block;
}

.page-turn.animating {
    pointer-events: none;
}

.page-front,
.page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background: #faf9f7;
}

.page-front::before,
.page-back::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px);
    opacity: 0.3;
    pointer-events: none;
}

.page-back {
    transform: rotateY(180deg);
}

.page-content {
    padding: 40px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
}

.page-number {
    position: absolute;
    bottom: 25px;
    font-size: 12px;
    color: #666;
    font-family: 'Georgia', serif;
    font-style: italic;
}

.page-left .page-number {
    left: 40px;
}

.page-right .page-number {
    right: 40px;
}

.page-front .page-number {
    right: 40px;
}

.page-back .page-number {
    left: 40px;
}

.photo {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: white;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 0 1px rgba(0, 0, 0, 0.1);
}

.placeholder-photo {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
    position: relative;
}

/* Add a glossy photo finish effect */
.placeholder-photo::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg,
        rgba(255,255,255,0.3) 0%,
        transparent 30%,
        transparent 70%,
        rgba(0,0,0,0.1) 100%);
    pointer-events: none;
}

.navigation {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-btn {
    padding: 14px 28px;
    font-size: 16px;
    background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
    border: 1px solid #999;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    font-family: 'Georgia', serif;
    color: #333;
    font-weight: 600;
}

.nav-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    background: linear-gradient(to bottom, #fff, #f0f0f0);
}

.nav-btn:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
}

.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.page-indicator {
    color: #d4c5b9;
    font-size: 18px;
    font-weight: 400;
    min-width: 130px;
    text-align: center;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

/* Realistic page turn animation with curve effect */
.turn-next {
    animation: turnPageNext 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
}

.turn-prev {
    animation: turnPagePrev 1.2s cubic-bezier(0.645, 0.045, 0.355, 1) forwards;
}

@keyframes turnPageNext {
    0% {
        transform: rotateY(0deg) translateZ(0px);
        box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
    }
    20% {
        transform: rotateY(-25deg) translateZ(10px) scale(1.01);
        box-shadow: 5px 10px 40px rgba(0, 0, 0, 0.4);
    }
    50% {
        transform: rotateY(-90deg) translateZ(20px) scale(1.02);
        box-shadow: 10px 20px 60px rgba(0, 0, 0, 0.6);
    }
    80% {
        transform: rotateY(-155deg) translateZ(10px) scale(1.01);
        box-shadow: 5px 10px 40px rgba(0, 0, 0, 0.4);
    }
    100% {
        transform: rotateY(-180deg) translateZ(0px);
        box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
    }
}

@keyframes turnPagePrev {
    0% {
        transform: rotateY(-180deg) translateZ(0px);
        box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
    }
    20% {
        transform: rotateY(-155deg) translateZ(10px) scale(1.01);
        box-shadow: 5px 10px 40px rgba(0, 0, 0, 0.4);
    }
    50% {
        transform: rotateY(-90deg) translateZ(20px) scale(1.02);
        box-shadow: 10px 20px 60px rgba(0, 0, 0, 0.6);
    }
    80% {
        transform: rotateY(-25deg) translateZ(10px) scale(1.01);
        box-shadow: 5px 10px 40px rgba(0, 0, 0, 0.4);
    }
    100% {
        transform: rotateY(0deg) translateZ(0px);
        box-shadow: 0 5px 30px rgba(0, 0, 0, 0.3);
    }
}

@media (max-width: 900px) {
    .book {
        width: 620px;
        height: 450px;
    }

    .book-spine {
        height: 450px;
    }

    .page {
        width: 300px;
        height: 450px;
    }

    .page-content {
        padding: 30px;
    }

    .placeholder-photo {
        font-size: 22px;
    }
}

@media (max-width: 650px) {
    .book {
        width: 420px;
        height: 300px;
        transform: rotateY(-20deg) rotateX(3deg);
    }

    .book-spine {
        height: 300px;
        width: 15px;
    }

    .page {
        width: 200px;
        height: 300px;
    }

    .page-content {
        padding: 20px;
    }

    .placeholder-photo {
        font-size: 16px;
    }

    .nav-btn {
        padding: 10px 20px;
        font-size: 14px;
    }

    .page-indicator {
        font-size: 16px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="book-wrapper">
            <div class="book">
                <!-- Book spine -->
                <div class="book-spine"></div>

                <!-- Left page -->
                <div class="page page-left" data-page="left">
                    <div class="page-content">
                        <div class="page-number">1</div>
                        <div class="photo">
                            <div class="placeholder-photo" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                                <span>Photo 1</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right page -->
                <div class="page page-right" data-page="right">
                    <div class="page-content">
                        <div class="page-number">2</div>
                        <div class="photo">
                            <div class="placeholder-photo" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                                <span>Photo 2</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Turning page -->
                <div class="page page-turn">
                    <div class="page-front">
                        <div class="page-content">
                            <div class="page-number"></div>
                            <div class="photo">
                                <div class="placeholder-photo"></div>
                            </div>
                        </div>
                    </div>
                    <div class="page-back">
                        <div class="page-content">
                            <div class="page-number"></div>
                            <div class="photo">
                                <div class="placeholder-photo"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <div class="navigation">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <span id="pageIndicator" class="page-indicator">Page 1-2</span>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
    </div>

    <script>
class PhotoBook {
    constructor() {
        this.currentPage = 0;
        this.totalPages = 10;
        this.isAnimating = false;

        this.pages = [
            { color: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', text: 'Photo 1' },
            { color: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', text: 'Photo 2' },
            { color: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', text: 'Photo 3' },
            { color: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', text: 'Photo 4' },
            { color: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', text: 'Photo 5' },
            { color: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)', text: 'Photo 6' },
            { color: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', text: 'Photo 7' },
            { color: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', text: 'Photo 8' },
            { color: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', text: 'Photo 9' },
            { color: 'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)', text: 'Photo 10' }
        ];

        this.init();
    }

    init() {
        this.pageLeft = document.querySelector('.page-left');
        this.pageRight = document.querySelector('.page-right');
        this.pageTurn = document.querySelector('.page-turn');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.pageIndicator = document.getElementById('pageIndicator');

        this.pageLeft.addEventListener('click', () => this.turnToPrevious());
        this.pageRight.addEventListener('click', () => this.turnToNext());
        this.prevBtn.addEventListener('click', () => this.turnToPrevious());
        this.nextBtn.addEventListener('click', () => this.turnToNext());

        this.addTouchSupport();
        this.updatePages();
    }

    addTouchSupport() {
        let touchStartX = 0;
        let touchEndX = 0;

        const handleSwipe = () => {
            if (touchEndX < touchStartX - 50) {
                this.turnToNext();
            }
            if (touchEndX > touchStartX + 50) {
                this.turnToPrevious();
            }
        };

        document.querySelector('.book').addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        });

        document.querySelector('.book').addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        });
    }

    updatePages() {
        if (this.currentPage > 0) {
            this.updatePageContent(this.pageLeft, this.currentPage - 1);
        }

        if (this.currentPage < this.totalPages) {
            this.updatePageContent(this.pageRight, this.currentPage);
        }

        this.prevBtn.disabled = this.currentPage === 0;
        this.nextBtn.disabled = this.currentPage >= this.totalPages;

        const leftPageNum = this.currentPage === 0 ? 1 : this.currentPage;
        const rightPageNum = this.currentPage + 1;
        this.pageIndicator.textContent = `Page ${leftPageNum}-${rightPageNum}`;
    }

    updatePageContent(pageElement, pageIndex) {
        const photo = pageElement.querySelector('.placeholder-photo');
        const pageNumber = pageElement.querySelector('.page-number');

        if (pageIndex >= 0 && pageIndex < this.pages.length) {
            photo.style.background = this.pages[pageIndex].color;
            photo.innerHTML = `<span>${this.pages[pageIndex].text}</span>`;
            pageNumber.textContent = pageIndex + 1;
        }
    }

    turnToNext() {
        if (this.isAnimating || this.currentPage >= this.totalPages) return;

        this.isAnimating = true;
        this.pageTurn.classList.add('active', 'animating');

        const pageFront = this.pageTurn.querySelector('.page-front .placeholder-photo');
        const pageFrontNumber = this.pageTurn.querySelector('.page-front .page-number');
        const pageBack = this.pageTurn.querySelector('.page-back .placeholder-photo');
        const pageBackNumber = this.pageTurn.querySelector('.page-back .page-number');

        if (this.currentPage < this.pages.length) {
            pageFront.style.background = this.pages[this.currentPage].color;
            pageFront.innerHTML = `<span>${this.pages[this.currentPage].text}</span>`;
            pageFrontNumber.textContent = this.currentPage + 1;
        }

        if (this.currentPage + 1 < this.pages.length) {
            pageBack.style.background = this.pages[this.currentPage + 1].color;
            pageBack.innerHTML = `<span>${this.pages[this.currentPage + 1].text}</span>`;
            pageBackNumber.textContent = this.currentPage + 2;
        }

        this.pageTurn.classList.add('turn-next');

        setTimeout(() => {
            this.currentPage += 2;
            this.updatePages();
            this.resetTurningPage();
        }, 1200);
    }

    turnToPrevious() {
        if (this.isAnimating || this.currentPage === 0) return;

        this.isAnimating = true;
        this.pageTurn.classList.add('active', 'animating');
        this.pageTurn.style.right = 'auto';
        this.pageTurn.style.left = '0';
        this.pageTurn.style.transformOrigin = 'right center';

        const pageFront = this.pageTurn.querySelector('.page-front .placeholder-photo');
        const pageFrontNumber = this.pageTurn.querySelector('.page-front .page-number');
        const pageBack = this.pageTurn.querySelector('.page-back .placeholder-photo');
        const pageBackNumber = this.pageTurn.querySelector('.page-back .page-number');

        if (this.currentPage - 1 >= 0 && this.currentPage - 1 < this.pages.length) {
            pageFront.style.background = this.pages[this.currentPage - 1].color;
            pageFront.innerHTML = `<span>${this.pages[this.currentPage - 1].text}</span>`;
            pageFrontNumber.textContent = this.currentPage;
        }

        if (this.currentPage - 2 >= 0 && this.currentPage - 2 < this.pages.length) {
            pageBack.style.background = this.pages[this.currentPage - 2].color;
            pageBack.innerHTML = `<span>${this.pages[this.currentPage - 2].text}</span>`;
            pageBackNumber.textContent = this.currentPage - 1;
        }

        this.pageTurn.style.transform = 'rotateY(-180deg)';

        setTimeout(() => {
            this.pageTurn.classList.add('turn-prev');
        }, 50);

        setTimeout(() => {
            this.currentPage -= 2;
            this.updatePages();
            this.resetTurningPage();
        }, 1250);
    }

    resetTurningPage() {
        this.pageTurn.classList.remove('active', 'animating', 'turn-next', 'turn-prev');
        this.pageTurn.style.transform = '';
        this.pageTurn.style.right = '0';
        this.pageTurn.style.left = 'auto';
        this.pageTurn.style.transformOrigin = 'left center';
        this.isAnimating = false;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new PhotoBook();
});
    </script>
</body>
</html>
