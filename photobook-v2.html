<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Photo Book - Realistic Page Curl</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #2c1810 0%, #5a3d2b 50%, #2c1810 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    user-select: none;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 50px;
}

.book-wrapper {
    perspective: 2500px;
    perspective-origin: center center;
}

.book {
    width: 820px;
    height: 600px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateY(-25deg) rotateX(5deg);
    transition: transform 0.5s ease;
    filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.6));
}

.book:hover {
    transform: rotateY(-20deg) rotateX(3deg);
}

.book-spine {
    position: absolute;
    width: 20px;
    height: 600px;
    left: 50%;
    transform: translateX(-50%) translateZ(-10px);
    background: linear-gradient(to right,
        #1a1a1a 0%,
        #2d2d2d 20%,
        #3a3a3a 50%,
        #2d2d2d 80%,
        #1a1a1a 100%);
    box-shadow:
        inset 2px 0 4px rgba(0, 0, 0, 0.5),
        inset -2px 0 4px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(0, 0, 0, 0.3);
    z-index: 5;
}

.page {
    position: absolute;
    width: 400px;
    height: 600px;
    background: #faf9f7;
    transform-style: preserve-3d;
    backface-visibility: hidden;
}

.page::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px);
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
}

.page-left {
    left: 0;
    transform-origin: right center;
    border-right: 1px solid #d4d1ca;
    box-shadow:
        inset -5px 0 10px rgba(0, 0, 0, 0.1),
        -2px 0 5px rgba(0, 0, 0, 0.1),
        0 5px 30px rgba(0, 0, 0, 0.3);
}

.page-left:hover {
    box-shadow:
        inset -5px 0 10px rgba(0, 0, 0, 0.15),
        -2px 0 8px rgba(0, 0, 0, 0.15),
        0 5px 35px rgba(0, 0, 0, 0.4);
}

.page-right {
    right: 0;
    transform-origin: left center;
    border-left: 1px solid #d4d1ca;
    box-shadow:
        inset 5px 0 10px rgba(0, 0, 0, 0.1),
        2px 0 5px rgba(0, 0, 0, 0.1),
        0 5px 30px rgba(0, 0, 0, 0.3);
    cursor: grab;
}

.page-right:active {
    cursor: grabbing;
}

.page-right:hover {
    box-shadow:
        inset 5px 0 10px rgba(0, 0, 0, 0.15),
        2px 0 8px rgba(0, 0, 0, 0.15),
        0 5px 35px rgba(0, 0, 0, 0.4);
}

/* Interactive page turn container */
.page-turn-container {
    position: absolute;
    right: 0;
    width: 400px;
    height: 600px;
    transform-origin: left center;
    transform-style: preserve-3d;
    pointer-events: none;
    z-index: 10;
}

.page-turn-container.active {
    pointer-events: auto;
}

.page-turn {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: none;
}

.page-turn.animating {
    transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1),
                box-shadow 0.6s cubic-bezier(0.645, 0.045, 0.355, 1);
}

.page-front,
.page-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background: #faf9f7;
    overflow: hidden;
}

.page-front::before,
.page-back::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,.02) 2px, rgba(0,0,0,.02) 4px);
    opacity: 0.3;
    pointer-events: none;
    z-index: 1;
}

.page-back {
    transform: rotateY(180deg);
}

/* Curl shadow on the turning page */
.page-front::after {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 100px;
    height: 100%;
    background: linear-gradient(to left, rgba(0,0,0,0.3), transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 2;
}

.page-turn-container.active .page-front::after {
    opacity: 1;
}

.page-content {
    padding: 40px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    z-index: 2;
}

.page-number {
    position: absolute;
    bottom: 25px;
    font-size: 12px;
    color: #666;
    font-family: 'Georgia', serif;
    font-style: italic;
}

.page-left .page-number {
    left: 40px;
}

.page-right .page-number {
    right: 40px;
}

.page-front .page-number {
    right: 40px;
}

.page-back .page-number {
    left: 40px;
}

.photo {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: white;
    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.15),
        inset 0 0 1px rgba(0, 0, 0, 0.1);
}

.placeholder-photo {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    font-family: 'Georgia', serif;
    position: relative;
}

.placeholder-photo::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg,
        rgba(255,255,255,0.3) 0%,
        transparent 30%,
        transparent 70%,
        rgba(0,0,0,0.1) 100%);
    pointer-events: none;
}

/* Drag hint on corner */
.drag-hint {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, transparent 0%, transparent 50%, rgba(255,255,255,0.1) 50%);
    pointer-events: all;
    cursor: grab;
    z-index: 15;
    transition: opacity 0.3s;
}

.drag-hint:active {
    cursor: grabbing;
}

.drag-hint:hover {
    background: linear-gradient(135deg, transparent 0%, transparent 50%, rgba(255,255,255,0.2) 50%);
}

.navigation {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-btn {
    padding: 14px 28px;
    font-size: 16px;
    background: linear-gradient(to bottom, #f5f5f5, #e8e8e8);
    border: 1px solid #999;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    font-family: 'Georgia', serif;
    color: #333;
    font-weight: 600;
}

.nav-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    background: linear-gradient(to bottom, #fff, #f0f0f0);
}

.nav-btn:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
}

.nav-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.page-indicator {
    color: #d4c5b9;
    font-size: 18px;
    font-weight: 400;
    min-width: 130px;
    text-align: center;
    font-family: 'Georgia', serif;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
}

@media (max-width: 900px) {
    .book {
        width: 620px;
        height: 450px;
    }

    .book-spine {
        height: 450px;
    }

    .page {
        width: 300px;
        height: 450px;
    }

    .page-turn-container {
        width: 300px;
        height: 450px;
    }

    .page-content {
        padding: 30px;
    }

    .placeholder-photo {
        font-size: 22px;
    }
}

@media (max-width: 650px) {
    .book {
        width: 420px;
        height: 300px;
        transform: rotateY(-20deg) rotateX(3deg);
    }

    .book-spine {
        height: 300px;
        width: 15px;
    }

    .page {
        width: 200px;
        height: 300px;
    }

    .page-turn-container {
        width: 200px;
        height: 300px;
    }

    .page-content {
        padding: 20px;
    }

    .placeholder-photo {
        font-size: 16px;
    }

    .nav-btn {
        padding: 10px 20px;
        font-size: 14px;
    }

    .page-indicator {
        font-size: 16px;
    }

    .drag-hint {
        width: 60px;
        height: 60px;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="book-wrapper">
            <div class="book">
                <div class="book-spine"></div>

                <div class="page page-left" data-page="left">
                    <div class="page-content">
                        <div class="page-number">1</div>
                        <div class="photo">
                            <div class="placeholder-photo" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                                <span>Photo 1</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="page page-right" data-page="right">
                    <div class="page-content">
                        <div class="page-number">2</div>
                        <div class="photo">
                            <div class="placeholder-photo" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                                <span>Photo 2</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="page-turn-container">
                    <div class="drag-hint"></div>
                    <div class="page-turn">
                        <div class="page-front">
                            <div class="page-content">
                                <div class="page-number"></div>
                                <div class="photo">
                                    <div class="placeholder-photo"></div>
                                </div>
                            </div>
                        </div>
                        <div class="page-back">
                            <div class="page-content">
                                <div class="page-number"></div>
                                <div class="photo">
                                    <div class="placeholder-photo"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button id="prevBtn" class="nav-btn">← Previous</button>
            <span id="pageIndicator" class="page-indicator">Page 1-2</span>
            <button id="nextBtn" class="nav-btn">Next →</button>
        </div>
    </div>

    <script>
class PhotoBook {
    constructor() {
        this.currentPage = 0;
        this.totalPages = 10;
        this.isAnimating = false;
        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartY = 0;
        this.currentRotation = 0;

        this.pages = [
            { color: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', text: 'Photo 1' },
            { color: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)', text: 'Photo 2' },
            { color: 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)', text: 'Photo 3' },
            { color: 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)', text: 'Photo 4' },
            { color: 'linear-gradient(135deg, #fa709a 0%, #fee140 100%)', text: 'Photo 5' },
            { color: 'linear-gradient(135deg, #30cfd0 0%, #330867 100%)', text: 'Photo 6' },
            { color: 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)', text: 'Photo 7' },
            { color: 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%)', text: 'Photo 8' },
            { color: 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)', text: 'Photo 9' },
            { color: 'linear-gradient(135deg, #ff6e7f 0%, #bfe9ff 100%)', text: 'Photo 10' }
        ];

        this.init();
    }

    init() {
        this.pageLeft = document.querySelector('.page-left');
        this.pageRight = document.querySelector('.page-right');
        this.pageTurnContainer = document.querySelector('.page-turn-container');
        this.pageTurn = document.querySelector('.page-turn');
        this.dragHint = document.querySelector('.drag-hint');
        this.prevBtn = document.getElementById('prevBtn');
        this.nextBtn = document.getElementById('nextBtn');
        this.pageIndicator = document.getElementById('pageIndicator');

        // Drag events
        this.dragHint.addEventListener('mousedown', (e) => this.startDrag(e));
        this.dragHint.addEventListener('touchstart', (e) => this.startDrag(e));
        document.addEventListener('mousemove', (e) => this.onDrag(e));
        document.addEventListener('touchmove', (e) => this.onDrag(e));
        document.addEventListener('mouseup', (e) => this.endDrag(e));
        document.addEventListener('touchend', (e) => this.endDrag(e));

        // Button events
        this.prevBtn.addEventListener('click', () => this.turnToPrevious());
        this.nextBtn.addEventListener('click', () => this.turnToNext());

        this.updatePages();
    }

    startDrag(e) {
        if (this.isAnimating || this.currentPage >= this.totalPages) return;

        e.preventDefault();
        this.isDragging = true;

        const touch = e.touches ? e.touches[0] : e;
        this.dragStartX = touch.clientX;
        this.dragStartY = touch.clientY;

        this.pageTurnContainer.classList.add('active');
        this.pageTurn.classList.remove('animating');

        // Set up the page content
        this.setupTurnPage();
    }

    onDrag(e) {
        if (!this.isDragging) return;

        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const deltaX = this.dragStartX - touch.clientX;
        const deltaY = touch.clientY - this.dragStartY;

        // Calculate rotation based on drag distance
        // More negative deltaX = more page turned
        let rotation = Math.max(0, Math.min(180, (deltaX / 400) * 180));

        // Add subtle vertical tilt based on Y movement
        const tiltY = Math.max(-15, Math.min(15, (deltaY / 100) * 10));

        this.currentRotation = rotation;

        // Apply the transform with realistic physics
        // Add a slight scale and translateZ for depth
        const scale = 1 + (Math.sin((rotation / 180) * Math.PI) * 0.05);
        const translateZ = Math.sin((rotation / 180) * Math.PI) * 30;

        this.pageTurn.style.transform = `
            rotateY(${-rotation}deg)
            rotateX(${tiltY}deg)
            scale(${scale})
            translateZ(${translateZ}px)
        `;

        // Update shadow intensity
        const shadowIntensity = Math.sin((rotation / 180) * Math.PI);
        this.pageTurn.style.boxShadow = `
            ${shadowIntensity * 20}px
            ${shadowIntensity * 30}px
            ${shadowIntensity * 80}px
            rgba(0, 0, 0, ${0.4 + shadowIntensity * 0.3})
        `;
    }

    endDrag(e) {
        if (!this.isDragging) return;

        this.isDragging = false;

        // Determine if we should complete the turn or spring back
        const threshold = 90; // degrees

        if (this.currentRotation > threshold) {
            // Complete the turn
            this.completeTurn();
        } else {
            // Spring back
            this.springBack();
        }
    }

    completeTurn() {
        this.isAnimating = true;
        this.pageTurn.classList.add('animating');
        this.pageTurn.style.transform = 'rotateY(-180deg) scale(1) translateZ(0px)';
        this.pageTurn.style.boxShadow = '0 5px 30px rgba(0, 0, 0, 0.3)';

        setTimeout(() => {
            this.currentPage += 2;
            this.updatePages();
            this.resetTurnPage();
        }, 600);
    }

    springBack() {
        this.pageTurn.classList.add('animating');
        this.pageTurn.style.transform = 'rotateY(0deg) scale(1) translateZ(0px)';
        this.pageTurn.style.boxShadow = '0 5px 30px rgba(0, 0, 0, 0.3)';

        setTimeout(() => {
            this.resetTurnPage();
        }, 600);
    }

    setupTurnPage() {
        const pageFront = this.pageTurn.querySelector('.page-front .placeholder-photo');
        const pageFrontNumber = this.pageTurn.querySelector('.page-front .page-number');
        const pageBack = this.pageTurn.querySelector('.page-back .placeholder-photo');
        const pageBackNumber = this.pageTurn.querySelector('.page-back .page-number');

        if (this.currentPage < this.pages.length) {
            pageFront.style.background = this.pages[this.currentPage].color;
            pageFront.innerHTML = `<span>${this.pages[this.currentPage].text}</span>`;
            pageFrontNumber.textContent = this.currentPage + 1;
        }

        if (this.currentPage + 1 < this.pages.length) {
            pageBack.style.background = this.pages[this.currentPage + 1].color;
            pageBack.innerHTML = `<span>${this.pages[this.currentPage + 1].text}</span>`;
            pageBackNumber.textContent = this.currentPage + 2;
        }
    }

    resetTurnPage() {
        this.pageTurnContainer.classList.remove('active');
        this.pageTurn.classList.remove('animating');
        this.pageTurn.style.transform = '';
        this.pageTurn.style.boxShadow = '';
        this.currentRotation = 0;
        this.isAnimating = false;
    }

    updatePages() {
        if (this.currentPage > 0) {
            this.updatePageContent(this.pageLeft, this.currentPage - 1);
        }

        if (this.currentPage < this.totalPages) {
            this.updatePageContent(this.pageRight, this.currentPage);
        }

        this.prevBtn.disabled = this.currentPage === 0;
        this.nextBtn.disabled = this.currentPage >= this.totalPages;
        this.dragHint.style.opacity = this.currentPage >= this.totalPages ? '0' : '1';

        const leftPageNum = this.currentPage === 0 ? 1 : this.currentPage;
        const rightPageNum = this.currentPage + 1;
        this.pageIndicator.textContent = `Page ${leftPageNum}-${rightPageNum}`;
    }

    updatePageContent(pageElement, pageIndex) {
        const photo = pageElement.querySelector('.placeholder-photo');
        const pageNumber = pageElement.querySelector('.page-number');

        if (pageIndex >= 0 && pageIndex < this.pages.length) {
            photo.style.background = this.pages[pageIndex].color;
            photo.innerHTML = `<span>${this.pages[pageIndex].text}</span>`;
            pageNumber.textContent = pageIndex + 1;
        }
    }

    turnToNext() {
        if (this.isAnimating || this.currentPage >= this.totalPages) return;

        this.pageTurnContainer.classList.add('active');
        this.setupTurnPage();

        setTimeout(() => {
            this.completeTurn();
        }, 50);
    }

    turnToPrevious() {
        if (this.isAnimating || this.currentPage === 0) return;

        // For previous, we'd need to implement left page turning
        // This is more complex as it requires different setup
        this.currentPage -= 2;
        this.updatePages();
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new PhotoBook();
});
    </script>
</body>
</html>
