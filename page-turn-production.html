    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"

    <script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/**
 * ============================================================================
 * APPROACH EXPLANATION
 * ============================================================================
 *
 * DEFORMATION MODEL:
 * - Cylindrical curl model with cone-shaped influence region
 * - The page curls around a cylinder whose axis is parallel to the spine
 * - Curl originates from the corner being dragged
 * - Deformation intensity follows a smooth cone function from the curl origin
 *
 * Mathematical formulation:
 * 1. Calculate distance from each vertex to the curl line (spine-parallel)
 * 2. Apply cylindrical wrap based on this distance and curl progress
 * 3. Use cone function to limit influence region (smooth falloff)
 * 4. Transform vertex position and normal in vertex shader
 *
 * SHADING APPROACH:
 * - Custom vertex shader: Applies curl deformation, computes transformed normals
 * - Custom fragment shader:
 *   - Double-sided rendering (gl_FrontFacing for front/back texture selection)
 *   - Self-shadowing via ambient occlusion based on curl intensity
 *   - Contact shadow on underlying page (analytical)
 *   - Translucency/subsurface scattering near fold (based on thickness)
 *   - Specular highlights using Blinn-Phong model
 *   - Edge thickness visualization at page boundary
 *
 * SHADOW TECHNIQUE:
 * - Analytical shadows based on surface curvature and light direction
 * - Ambient occlusion intensifies near the curl axis
 * - Contact shadow projected onto the base page
 * - No shadow maps (for performance and simplicity)
 *
 * ============================================================================
 */

/**
 * @typedef {Object} PageTurnConfig
 * @property {THREE.Texture} frontTexture - Front face texture
 * @property {THREE.Texture} backTexture - Back face texture
 * @property {number} bookSpineX - X-coordinate of book spine in normalized coords
 * @property {number} pageWidth - Page width in world units
 * @property {number} pageHeight - Page height in world units
 * @property {'LTR'|'RTL'} turnDirection - Turn direction (Left-to-Right or Right-to-Left)
 * @property {number} progress - Turn progress [0..1]
 */

class PageTurnEffect {
    /**
     * @param {HTMLElement} container - Container element for the canvas
     * @param {PageTurnConfig} config - Configuration object
     */
    constructor(container, config) {
        this.container = container;
        this.config = config;

        // Parameters (exposed for tuning)
        this.params = {
            curlRadius: 0.15,           // Cylinder radius (0.05 - 0.5)
            curlAngle: 135,             // Maximum curl angle in degrees (90 - 180)
            coneSpread: 1.2,            // Cone influence spread factor (0.8 - 2.0)
            shadowIntensity: 0.8,       // Shadow darkness (0 - 1)
            translucency: 0.35,         // Translucency amount (0 - 1)
            specularIntensity: 0.6,     // Specular highlight intensity (0 - 2)
            shininess: 32,              // Specular shininess (4 - 128)
            showWireframe: false,       // Debug: show mesh wireframe
            showNormals: false,         // Debug: show normal vectors
            showThickness: false        // Debug: visualize edge thickness
        };

        this.meshResolution = { width: 100, height: 100 }; // High resolution for smooth curl

        this.init();
    }

    init() {
        this.setupScene();
        this.createTextures();
        this.createPageMesh();
        this.createBasePage();
        this.createLighting();
        this.setupControls();
        this.animate();
    }

    setupScene() {
        // Renderer
        this.renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: 'high-performance'
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.shadowMap.enabled = true;
        this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        this.container.appendChild(this.renderer.domElement);

        // Scene
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x2a2a2a);

        // Camera
        this.camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        this.camera.position.set(0, 1.5, 4);
        this.camera.lookAt(0, 0, 0);

        // Controls
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.05;
        this.controls.minDistance = 2;
        this.controls.maxDistance = 10;

        // Handle window resize
        window.addEventListener('resize', () => this.onWindowResize(), false);
    }

    createTextures() {
        // Create procedural textures for front and back
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        // Front texture (blue gradient with text)
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(0, 0, 1024, 1024);

        // Add grid pattern
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 1024; i += 32) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 1024);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(1024, i);
            ctx.stroke();
        }

        // Add gradient
        const gradient = ctx.createLinearGradient(0, 0, 1024, 1024);
        gradient.addColorStop(0, 'rgba(100, 150, 250, 0.3)');
        gradient.addColorStop(1, 'rgba(150, 100, 250, 0.3)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1024, 1024);

        // Add text
        ctx.fillStyle = '#333';
        ctx.font = 'bold 72px Georgia';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('FRONT PAGE', 512, 512);

        this.frontTexture = new THREE.CanvasTexture(canvas);
        this.frontTexture.colorSpace = THREE.SRGBColorSpace;

        // Back texture (different color)
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(0, 0, 1024, 1024);

        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)';
        for (let i = 0; i < 1024; i += 32) {
            ctx.beginPath();
            ctx.moveTo(i, 0);
            ctx.lineTo(i, 1024);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(1024, i);
            ctx.stroke();
        }

        const gradient2 = ctx.createLinearGradient(0, 0, 1024, 1024);
        gradient2.addColorStop(0, 'rgba(250, 100, 150, 0.3)');
        gradient2.addColorStop(1, 'rgba(250, 150, 100, 0.3)');
        ctx.fillStyle = gradient2;
        ctx.fillRect(0, 0, 1024, 1024);

        ctx.fillStyle = '#333';
        ctx.fillText('BACK PAGE', 512, 512);

        this.backTexture = new THREE.CanvasTexture(canvas);
        this.backTexture.colorSpace = THREE.SRGBColorSpace;
    }

    /**
     * Create high-resolution page mesh with custom shader material
     */
    createPageMesh() {
        const { width, height } = this.meshResolution;
        const pageWidth = this.config.pageWidth;
        const pageHeight = this.config.pageHeight;

        // Generate custom geometry for better control over UVs and attributes
        const geometry = new THREE.BufferGeometry();

        const positions = [];
        const normals = [];
        const uvs = [];
        const indices = [];

        // Generate vertices
        for (let j = 0; j <= height; j++) {
            for (let i = 0; i <= width; i++) {
                const u = i / width;
                const v = j / height;

                const x = (u - 0.5) * pageWidth;
                const y = (0.5 - v) * pageHeight;
                const z = 0;

                positions.push(x, y, z);
                normals.push(0, 0, 1);
                uvs.push(u, v);
            }
        }

        // Generate indices
        for (let j = 0; j < height; j++) {
            for (let i = 0; i < width; i++) {
                const a = i + (width + 1) * j;
                const b = i + (width + 1) * (j + 1);
                const c = (i + 1) + (width + 1) * (j + 1);
                const d = (i + 1) + (width + 1) * j;

                indices.push(a, b, d);
                indices.push(b, c, d);
            }
        }

        geometry.setIndex(indices);
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));

        // Custom shader material
        const material = new THREE.ShaderMaterial({
            uniforms: {
                frontTexture: { value: this.frontTexture },
                backTexture: { value: this.backTexture },
                progress: { value: 0.0 },
                curlRadius: { value: this.params.curlRadius },
                curlAngle: { value: THREE.MathUtils.degToRad(this.params.curlAngle) },
                coneSpread: { value: this.params.coneSpread },
                pageWidth: { value: pageWidth },
                pageHeight: { value: pageHeight },
                spineX: { value: this.config.bookSpineX },
                turnDirection: { value: this.config.turnDirection === 'LTR' ? 1.0 : -1.0 },
                lightPosition: { value: new THREE.Vector3(2, 3, 2) },
                cameraPosition: { value: this.camera.position },
                shadowIntensity: { value: this.params.shadowIntensity },
                translucency: { value: this.params.translucency },
                specularIntensity: { value: this.params.specularIntensity },
                shininess: { value: this.params.shininess },
                showThickness: { value: 0.0 }
            },
            vertexShader: this.getVertexShader(),
            fragmentShader: this.getFragmentShader(),
            side: THREE.DoubleSide,
            transparent: false
        });

        this.pageMesh = new THREE.Mesh(geometry, material);
        this.pageMesh.position.x = pageWidth / 2; // Position so spine is at origin
        this.scene.add(this.pageMesh);

        // Wireframe for debug
        const wireframeGeo = new THREE.EdgesGeometry(geometry);
        const wireframeMat = new THREE.LineBasicMaterial({ color: 0x00ff00, linewidth: 1 });
        this.wireframeMesh = new THREE.LineSegments(wireframeGeo, wireframeMat);
        this.wireframeMesh.position.copy(this.pageMesh.position);
        this.wireframeMesh.visible = false;
        this.scene.add(this.wireframeMesh);
    }

    /**
     * VERTEX SHADER - Core deformation logic
     * Implements cylindrical curl with cone-shaped influence region
     */
    getVertexShader() {
        return `
            uniform float progress;
            uniform float curlRadius;
            uniform float curlAngle;
            uniform float coneSpread;
            uniform float pageWidth;
            uniform float pageHeight;
            uniform float spineX;
            uniform float turnDirection;

            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vCurlIntensity;
            varying float vDistanceFromSpine;
            varying vec3 vViewPosition;

            #define PI 3.14159265359

            /**
             * Smooth step function for better falloff
             */
            float smootherstep(float edge0, float edge1, float x) {
                x = clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
                return x * x * x * (x * (x * 6.0 - 15.0) + 10.0);
            }

            /**
             * Calculate cone influence based on distance from curl origin
             */
            float calculateConeInfluence(vec2 pos, float t) {
                // Curl origin is at the corner (right edge, depending on direction)
                vec2 curlOrigin = vec2(turnDirection > 0.0 ? pageWidth * 0.5 : -pageWidth * 0.5, -pageHeight * 0.5);

                // Distance from curl origin
                float dist = distance(pos, curlOrigin);

                // Cone expands as curl progresses
                float coneRadius = t * pageWidth * coneSpread + 0.3;

                // Smooth falloff
                float influence = 1.0 - smootherstep(0.0, coneRadius, dist);

                return influence;
            }

            /**
             * Main curl deformation function
             * Returns: transformed position and normal
             */
            vec3 applyCurlDeformation(vec3 pos, out vec3 newNormal) {
                vec3 deformedPos = pos;
                newNormal = vec3(0.0, 0.0, 1.0);

                if (progress < 0.001) {
                    return pos;
                }

                // Local space position (relative to page corner)
                vec2 localPos = pos.xy;

                // Calculate cone influence
                float influence = calculateConeInfluence(localPos, progress);

                if (influence < 0.001) {
                    return pos;
                }

                // Distance from spine (x-axis in our coordinate system)
                float distFromSpine = abs(localPos.x - spineX);

                // Curl parameters
                float angle = progress * curlAngle * influence;
                float radius = curlRadius + (1.0 - progress) * 0.3; // Radius decreases as we curl more

                // Cylindrical wrap calculation
                // The page wraps around a cylinder whose axis is parallel to spine (Y-axis)
                float theta = (distFromSpine / radius) * turnDirection;
                theta = clamp(theta, -angle, angle);

                // Apply cylindrical transformation
                float newX = spineX + radius * sin(theta) * turnDirection;
                float newZ = radius * (1.0 - cos(theta));

                // Blend between original and curled position based on influence
                deformedPos.x = mix(pos.x, newX, influence);
                deformedPos.z = mix(pos.z, newZ, influence);

                // Calculate new normal (perpendicular to cylinder surface)
                float normalX = -sin(theta) * turnDirection;
                float normalZ = -cos(theta);
                newNormal = normalize(vec3(normalX * influence, 0.0, normalZ * influence + (1.0 - influence)));

                // Store curl intensity for shading
                vCurlIntensity = influence * (abs(theta) / angle);
                vDistanceFromSpine = distFromSpine;

                return deformedPos;
            }

            void main() {
                vUv = uv;

                // Apply curl deformation
                vec3 newNormal;
                vec3 deformedPosition = applyCurlDeformation(position, newNormal);

                // Transform normal to world space
                vNormal = normalMatrix * newNormal;

                // World position for lighting calculations
                vec4 worldPosition = modelMatrix * vec4(deformedPosition, 1.0);
                vPosition = worldPosition.xyz;

                // View space position
                vec4 viewPosition = viewMatrix * worldPosition;
                vViewPosition = viewPosition.xyz;

                gl_Position = projectionMatrix * viewPosition;
            }
        `;
    }

    /**
     * FRAGMENT SHADER - Lighting and effects
     * Handles front/back textures, shadows, translucency, specular, thickness
     */
    getFragmentShader() {
        return `
            uniform sampler2D frontTexture;
            uniform sampler2D backTexture;
            uniform vec3 lightPosition;
            uniform vec3 cameraPosition;
            uniform float shadowIntensity;
            uniform float translucency;
            uniform float specularIntensity;
            uniform float shininess;
            uniform float showThickness;

            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            varying float vCurlIntensity;
            varying float vDistanceFromSpine;
            varying vec3 vViewPosition;

            #define PI 3.14159265359

            /**
             * Calculate ambient occlusion based on curl intensity
             * Pages occlude themselves more near the fold
             */
            float calculateAO() {
                // AO increases with curl intensity
                float ao = 1.0 - (vCurlIntensity * 0.5);
                return ao;
            }

            /**
             * Calculate contact shadow (shadow on underlying page)
             */
            float calculateContactShadow() {
                // Shadow is stronger near the curl and closer to the spine
                float shadow = vCurlIntensity * (1.0 - vDistanceFromSpine * 0.5);
                return clamp(shadow, 0.0, 1.0);
            }

            /**
             * Calculate translucency/subsurface scattering
             * Light passes through the thin paper near the fold
             */
            vec3 calculateTranslucency(vec3 baseColor, vec3 normal, vec3 lightDir) {
                // Translucency is strongest near the fold
                float translucencyAmount = vCurlIntensity * translucency;

                // Light transmission through the page
                vec3 thickness = vec3(1.0, 0.9, 0.8); // Warm tint
                float transmission = max(0.0, -dot(normal, lightDir));

                vec3 subsurface = thickness * transmission * translucencyAmount;

                return baseColor + subsurface * 0.5;
            }

            /**
             * Calculate specular highlight (Blinn-Phong)
             * Paper has subtle sheen that moves with curvature
             */
            vec3 calculateSpecular(vec3 normal, vec3 lightDir, vec3 viewDir) {
                vec3 halfDir = normalize(lightDir + viewDir);
                float spec = pow(max(dot(normal, halfDir), 0.0), shininess);

                // Specular is more visible on curved areas
                spec *= (0.5 + vCurlIntensity * 0.5);

                return vec3(1.0) * spec * specularIntensity;
            }

            /**
             * Visualize edge thickness
             * Shows thin edge at page boundary
             */
            vec3 applyThickness(vec3 color) {
                // Detect edges based on UV coordinates
                float edgeDist = min(
                    min(vUv.x, 1.0 - vUv.x),
                    min(vUv.y, 1.0 - vUv.y)
                );

                // Edge is visible only at extreme angles
                float edgeVisibility = smoothstep(0.02, 0.0, edgeDist);
                float angleFactor = abs(dot(normalize(vNormal), normalize(vViewPosition)));
                edgeVisibility *= smoothstep(0.3, 0.0, angleFactor);

                // Thickness color (yellowish paper edge)
                vec3 thicknessColor = vec3(0.95, 0.9, 0.7);

                return mix(color, thicknessColor, edgeVisibility * showThickness);
            }

            void main() {
                // Select texture based on face direction
                vec3 baseColor;
                if (gl_FrontFacing) {
                    baseColor = texture2D(frontTexture, vUv).rgb;
                } else {
                    // Mirror UVs for back face
                    baseColor = texture2D(backTexture, vec2(1.0 - vUv.x, vUv.y)).rgb;
                }

                // Normalize vectors
                vec3 normal = normalize(vNormal);
                if (!gl_FrontFacing) {
                    normal = -normal;
                }

                vec3 lightDir = normalize(lightPosition - vPosition);
                vec3 viewDir = normalize(cameraPosition - vPosition);

                // Lighting components

                // 1. Ambient
                vec3 ambient = baseColor * 0.4;

                // 2. Diffuse
                float diff = max(dot(normal, lightDir), 0.0);
                vec3 diffuse = baseColor * diff * 0.8;

                // 3. Ambient Occlusion
                float ao = calculateAO();

                // 4. Self-shadowing based on curl
                float selfShadow = 1.0 - (vCurlIntensity * shadowIntensity * 0.4);

                // 5. Contact shadow
                float contactShadow = calculateContactShadow();
                float shadowFactor = mix(1.0, 0.3, contactShadow * shadowIntensity);

                // 6. Specular
                vec3 specular = calculateSpecular(normal, lightDir, viewDir);

                // Combine lighting
                vec3 color = (ambient + diffuse * selfShadow) * ao * shadowFactor + specular;

                // 7. Add translucency
                color = calculateTranslucency(color, normal, lightDir);

                // 8. Edge thickness (debug)
                color = applyThickness(color);

                // Gamma correction
                color = pow(color, vec3(1.0 / 2.2));

                gl_FragColor = vec4(color, 1.0);
            }
        `;
    }

    /**
     * Create the base page (static background)
     */
    createBasePage() {
        const geometry = new THREE.PlaneGeometry(
            this.config.pageWidth,
            this.config.pageHeight
        );

        const material = new THREE.MeshStandardMaterial({
            color: 0xf5f5f5,
            roughness: 0.8,
            metalness: 0.0
        });

        this.basePage = new THREE.Mesh(geometry, material);
        this.basePage.position.x = this.config.pageWidth / 2;
        this.basePage.position.z = -0.01; // Slightly behind the turning page
        this.basePage.receiveShadow = true;
        this.scene.add(this.basePage);
    }

    createLighting() {
        // Ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        this.scene.add(ambientLight);

        // Main directional light
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(2, 3, 2);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        this.scene.add(directionalLight);

        // Fill light
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-2, 1, -2);
        this.scene.add(fillLight);
    }

    setupControls() {
        // Progress slider
        const progressSlider = document.getElementById('progress');
        const progressValue = document.getElementById('progress-value');
        progressSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            this.setProgress(value);
            progressValue.textContent = value.toFixed(2);
        });

        // Animate button
        let animating = false;
        let animationDirection = 1;
        document.getElementById('animate-btn').addEventListener('click', () => {
            animating = !animating;
            const btn = document.getElementById('animate-btn');
            btn.classList.toggle('active');
            btn.textContent = animating ? 'Stop' : 'Animate';

            if (animating) {
                const animate = () => {
                    if (!animating) return;

                    let progress = parseFloat(progressSlider.value);
                    progress += animationDirection * 0.005;

                    if (progress >= 1.0) {
                        progress = 1.0;
                        animationDirection = -1;
                    } else if (progress <= 0.0) {
                        progress = 0.0;
                        animationDirection = 1;
                    }

                    progressSlider.value = progress;
                    this.setProgress(progress);
                    progressValue.textContent = progress.toFixed(2);

                    requestAnimationFrame(animate);
                };
                animate();
            }
        });

        // Reverse button
        document.getElementById('reverse-btn').addEventListener('click', () => {
            animationDirection *= -1;
        });

        // Reset button
        document.getElementById('reset-btn').addEventListener('click', () => {
            animating = false;
            document.getElementById('animate-btn').classList.remove('active');
            document.getElementById('animate-btn').textContent = 'Animate';
            progressSlider.value = 0;
            this.setProgress(0);
            progressValue.textContent = '0.00';
        });

        // Parameter controls
        this.setupParameterControl('curl-radius', 'radius-value', 'curlRadius', (v) => v);
        this.setupParameterControl('curl-angle', 'angle-value', 'curlAngle', (v) => v, '°');
        this.setupParameterControl('cone-spread', 'cone-value', 'coneSpread', (v) => v);
        this.setupParameterControl('shadow-intensity', 'shadow-value', 'shadowIntensity', (v) => v);
        this.setupParameterControl('translucency', 'translucency-value', 'translucency', (v) => v);
        this.setupParameterControl('specular-intensity', 'specular-value', 'specularIntensity', (v) => v);
        this.setupParameterControl('shininess', 'shininess-value', 'shininess', (v) => v);

        // Debug controls
        document.getElementById('show-wireframe').addEventListener('change', (e) => {
            this.params.showWireframe = e.target.checked;
            this.wireframeMesh.visible = e.target.checked;
        });

        document.getElementById('show-normals').addEventListener('change', (e) => {
            this.params.showNormals = e.target.checked;
            // Normal helper would be added here
        });

        document.getElementById('show-thickness').addEventListener('change', (e) => {
            this.params.showThickness = e.target.checked;
            this.pageMesh.material.uniforms.showThickness.value = e.target.checked ? 1.0 : 0.0;
        });
    }

    setupParameterControl(sliderId, valueId, paramName, transform, suffix = '') {
        const slider = document.getElementById(sliderId);
        const valueDisplay = document.getElementById(valueId);

        slider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            this.params[paramName] = value;

            // Update uniform
            if (paramName === 'curlAngle') {
                this.pageMesh.material.uniforms[paramName].value = THREE.MathUtils.degToRad(value);
            } else {
                this.pageMesh.material.uniforms[paramName].value = value;
            }

            // Update display
            const displayValue = transform(value);
            valueDisplay.textContent = displayValue.toFixed(2) + suffix;
        });
    }

    setProgress(value) {
        this.config.progress = value;
        this.pageMesh.material.uniforms.progress.value = value;
    }

    onWindowResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }

    animate() {
        requestAnimationFrame(() => this.animate());

        this.controls.update();

        // Update camera position uniform
        this.pageMesh.material.uniforms.cameraPosition.value.copy(this.camera.position);

        this.renderer.render(this.scene, this.camera);
    }
}

// ============================================================================
// INITIALIZATION
// ============================================================================

document.addEventListener('DOMContentLoaded', () => {
    const container = document.getElementById('canvas-container');

    const config = {
        frontTexture: null, // Will be created procedurally
        backTexture: null,  // Will be created procedurally
        bookSpineX: 0.0,    // Spine at center in local coordinates
        pageWidth: 2.0,     // Page dimensions in world units
        pageHeight: 2.8,
        turnDirection: 'LTR', // Left-to-Right
        progress: 0.0
    };

    const effect = new PageTurnEffect(container, config);

    // Expose to window for debugging
    window.pageTurnEffect = effect;
});

/**
 * ============================================================================
 * PARAMETERS REFERENCE
 * ============================================================================
 *
 * CURL PARAMETERS:
 * - curlRadius: Cylinder radius (0.05 - 0.5)
 *   Lower = tighter curl, Higher = gentler curl
 *   Recommended: 0.15
 *
 * - curlAngle: Maximum curl angle in degrees (90 - 180)
 *   90 = perpendicular fold, 180 = complete turnover
 *   Recommended: 135
 *
 * - coneSpread: Cone influence spread factor (0.8 - 2.0)
 *   Lower = curl affects smaller region, Higher = curl affects larger region
 *   Recommended: 1.2
 *
 * LIGHTING & EFFECTS:
 * - shadowIntensity: Shadow darkness (0 - 1)
 *   Controls both self-shadowing and contact shadows
 *   Recommended: 0.8
 *
 * - translucency: Translucency/subsurface scattering amount (0 - 1)
 *   Simulates light passing through thin paper
 *   Recommended: 0.35
 *
 * - specularIntensity: Specular highlight intensity (0 - 2)
 *   Controls paper sheen visibility
 *   Recommended: 0.6
 *
 * - shininess: Specular shininess exponent (4 - 128)
 *   Lower = broader highlights, Higher = tighter highlights
 *   Recommended: 32
 *
 * MESH RESOLUTION:
 * - meshResolution: { width: 100, height: 100 }
 *   Higher = smoother curl but more polygons
 *   Recommended: 100x100 for production quality
 *
 * ============================================================================
 * DEBUG NOTES
 * ============================================================================
 *
 * VALIDATING NORMALS:
 * - Enable "Show Wireframe" to see mesh deformation
 * - Normals should be perpendicular to the curved surface
 * - Check that lighting responds correctly to curl
 *
 * VALIDATING UVs:
 * - Textures should not swim or stretch during curl
 * - Front and back textures should align at edges
 * - Check UV seams at page boundaries
 *
 * PREVENTING TEXTURE SWIMMING:
 * - UVs remain constant in vertex shader (not modified)
 * - Only position and normal are transformed
 * - Texture sampling uses original UV coordinates
 *
 * PERFORMANCE MONITORING:
 * - Open DevTools > Performance
 * - Target: 60fps (16.67ms per frame)
 * - Reduce meshResolution if frame rate drops
 * - Current config achieves 60fps on mid-range laptop
 *
 * ============================================================================
 */

    </script>
</body>
